name: Build PokeWalk Lite APK

on:
  push:
    paths:
      - "pokewalk-lite/**"
      - ".github/workflows/pokewalk-lite.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Unpack source
        run: |
          mkdir -p /tmp/pokewalk-build
          base64 --decode pokewalk-lite/PokeWalkLite-corrected.zip.b64 > /tmp/PokeWalkLite.zip
          unzip -q /tmp/PokeWalkLite.zip -d /tmp/pokewalk-build

      - name: Build debug APK
        working-directory: /tmp/pokewalk-build/PokeWalkLite
        run: gradle --no-daemon :app:assembleDebug

      - name: Copy APK
        run: cp /tmp/pokewalk-build/PokeWalkLite/app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/PokeWalkLite.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PokeWalkLite-apk
          path: PokeWalkLite.apk
          if-no-files-found: error
