name: Build PokeWalk Lite APK

on:
  push:
    paths:
      - "pokewalk-lite/**"
      - ".github/workflows/pokewalk-lite.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Build release APK
        working-directory: pokewalk-lite
        run: gradle --no-daemon :app:assembleRelease

      - name: Copy unsigned APK
        run: cp pokewalk-lite/app/build/outputs/apk/release/app-release-unsigned.apk PokeWalkLite-unsigned.apk

      - name: Restore stable signing key
        if: ${{ secrets.POKEWALK_KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.POKEWALK_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/pokewalk-lite-signing.p12"

      - name: Sign APK with stable key
        if: ${{ secrets.POKEWALK_KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_PASSWORD: ${{ secrets.POKEWALK_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.POKEWALK_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.POKEWALK_KEY_PASSWORD }}
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign \
            --ks "$RUNNER_TEMP/pokewalk-lite-signing.p12" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass env:KEY_PASSWORD \
            --out PokeWalkLite.apk \
            PokeWalkLite-unsigned.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs PokeWalkLite.apk

      - name: Upload signed APK
        if: ${{ secrets.POKEWALK_KEYSTORE_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: PokeWalkLite-apk
          path: PokeWalkLite.apk
          if-no-files-found: error

      - name: Upload unsigned APK
        uses: actions/upload-artifact@v4
        with:
          name: PokeWalkLite-unsigned-apk
          path: PokeWalkLite-unsigned.apk
          if-no-files-found: error
